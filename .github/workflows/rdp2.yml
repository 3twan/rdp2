name: RDP Tailscale Windows

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          net user atwan 6827.Nnnn /add
          net localgroup administrators atwan /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install and Start Tailscale
        shell: powershell
        run: |
          # تحميل وتثبيت Tailscale على الويندوز صامتًا
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          
          # الانتظار قليلًا حتى تبدأ الخدمة ثم تسجيل الدخول بالمفتاح
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-kz3dgPNpRG11CNTRL-afCi5UivjyLqD6ubaD8PyLCsswwU6eE6F --hostname=windows-rdp
          
          Write-Host "Tailscale connected successfully!"
