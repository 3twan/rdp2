
name: RDP Serveo

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          net user atwan 6827.Nnnn /add
          net localgroup administrators atwan /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Start Serveo Tunnel
        shell: bash
        run: |
          echo "Starting Serveo tunnel for RDP..."
          # هذا الأمر يقوم بفتح نفق TCP عبر Serveo على منفذ 3389
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
