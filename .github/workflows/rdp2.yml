name: RDP Tailscale

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          net user atwan 6827.Nnnn /add
          net localgroup administrators atwan /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install and Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: tskey-auth-kz3dgPNpRG11CNTRL-afCi5UivjyLqD6ubaD8PyLCsswwU6eE6F
          version: latest
          args: --hostname=windows-rdp --accept-routes
